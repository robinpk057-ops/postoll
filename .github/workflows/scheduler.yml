name: Postoll Scheduler

on:
  workflow_dispatch:

jobs:
  trigger-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call scheduler endpoint
        env:
          POSTOLL_SCHEDULER_URL: ${{ secrets.POSTOLL_SCHEDULER_URL }}
          POSTOLL_CRON_SECRET: ${{ secrets.POSTOLL_CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --max-time 115 \
            --retry 2 \
            --retry-delay 5 \
            -X POST "${POSTOLL_SCHEDULER_URL}" \
            -H "Authorization: Bearer ${POSTOLL_CRON_SECRET}" \
            -H "Content-Type: application/json"
