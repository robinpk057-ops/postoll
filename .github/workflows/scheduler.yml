name: Postoll Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "30 0 * * *"
  workflow_dispatch: {}

jobs:
  trigger-scheduler:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduler endpoint
        run: |
          curl -sf -X POST "${{ secrets.POSTOLL_SCHEDULER_URL }}" \
            -H "Authorization: Bearer ${{ secrets.POSTOLL_CRON_SECRET }}"

  sync-analytics:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Sync Growth tier daily analytics
        run: |
          BASE_URL="${POSTOLL_SCHEDULER_URL%/api/cron/scheduler}"
          curl -sf -X POST "${BASE_URL}/api/analytics/sync" \
            -H "Authorization: Bearer ${{ secrets.POSTOLL_CRON_SECRET }}"
        env:
          POSTOLL_SCHEDULER_URL: ${{ secrets.POSTOLL_SCHEDULER_URL }}
