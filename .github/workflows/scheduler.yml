name: Postoll Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  trigger-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduler endpoint
        run: |
          curl -sf -X POST "${{ secrets.POSTOLL_SCHEDULER_URL }}" \
            -H "Authorization: Bearer ${{ secrets.POSTOLL_CRON_SECRET }}"